# The merge gate (docs/tech/08, "CI workflows"): type check, unit tests and the web build.
# Runs on every pull request and push to main. Nothing here is scheduled.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the content bundle
        run: pnpm content:bundle

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Web build
        run: pnpm --filter @sprout/game build
