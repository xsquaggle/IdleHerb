<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sprout Tower preview</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #2a1b3d; color: #f6e7c8;
    font: 16px/1.5 ui-monospace, "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
  }
  main { max-width: 30rem; padding: 2rem 1.5rem; text-align: center; }
  svg { width: 96px; height: 96px; image-rendering: pixelated; }
  h1 { margin: 1rem 0 0; font-size: 1.75rem; letter-spacing: 0.08em; color: #ffd27a; }
  .tag { margin: 0.25rem 0 1.5rem; color: #a9d18a; text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.8rem; }
  p { margin: 0 0 1rem; }
  footer { margin-top: 2rem; font-size: 0.75rem; color: #b9a6cf; }
</style>
</head>
<body>
<main>
  <!-- A 12x12 pixel seedling, drawn as squares so it stays crisp at any size -->
  <svg viewBox="0 0 12 12" shape-rendering="crispEdges" role="img" aria-label="A small green sprout in a planter">
    <rect x="2" y="2" width="3" height="1" fill="#8fce6b"/>
    <rect x="1" y="3" width="4" height="1" fill="#8fce6b"/>
    <rect x="2" y="4" width="3" height="1" fill="#6bb04f"/>
    <rect x="7" y="1" width="3" height="1" fill="#a9d18a"/>
    <rect x="7" y="2" width="4" height="1" fill="#8fce6b"/>
    <rect x="7" y="3" width="3" height="1" fill="#6bb04f"/>
    <rect x="5" y="4" width="2" height="1" fill="#6bb04f"/>
    <rect x="5" y="5" width="2" height="2" fill="#4f8f3d"/>
    <rect x="2" y="7" width="8" height="1" fill="#e0a45c"/>
    <rect x="3" y="8" width="6" height="2" fill="#c4803d"/>
    <rect x="4" y="10" width="4" height="1" fill="#9c5f2c"/>
  </svg>
  <h1>Sprout Tower</h1>
  <div class="tag">Preview</div>
  <p>Nothing to play here yet.</p>
  <p>The first playable build will appear at this address when the first slice of the game is built. Keep this page bookmarked.</p>
  <footer>Build __BUILD__ &middot; published __DATE__</footer>
</main>
</body>
</html>
