pip:
  hello: Hi! I'm Pip. This windowsill is the start of something big. Tap the planter!
  first_harvest: Fresh mint! Spend those Coins on the green button to grow faster.
  milestone: A milestone! Every 25 levels the floor runs twice as fast.
  floor2: The Balcony Boxes pay more, but they take longer. Keep tapping!
  floor3: Hemp! A tall farm crop for rope, canvas, paper and more. Our flagship.
  welcome_chest: A Welcome Chest! Three gardeners want to work here. Tap to open it.
  hire: Hire Nana Sprig and the windowsill harvests itself!
  tap_bonus: With a manager on staff, every tap pays a bonus. Keep tapping to build Combo!
  bumper: Some taps are Bumpers now. They pay ten times as much!
  visitors: A Golden Sprout! Catch it before it floats away.
  spurt: The Growth Spurt meter is full. Press it and tap like the wind!
  top_floor: The whole tower! When growth slows, the compost heap turns it into richer soil.
  replant_ready: The compost heap is ready. Replant for a big boost to every floor!
  after_replant: Richer soil already! Spend Compost in the shop, then grow back faster.
  card_level: Two copies of a card level it up. Managers get stronger every level.

