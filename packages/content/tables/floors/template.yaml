# The floor template. Source of truth: docs/design/GDD.md 5.3.
# floors/generate.ts turns this file plus worlds/worlds.yaml into floors/wN.yaml.
# Regenerate with `pnpm content:floors` whenever D, T or the template changes.
ladder: 12                 # each floor's open cost is 12 times the last
floor1: { basePayout: 1, baseCycleSec: 0.6, levelBaseCost: 4, growth: 1.07, hireFee: 1000 }
floor2: { openCost: 60, basePayout: 50, baseCycleSec: 3, levelBaseCost: 70, growth: 1.15 }   # 70, not 69 (GDD 2.2 rule 7)
payoutRatio: 0.75          # basePayout of floor n >= 3 is ratio x T^(n-3) x its unscaled open cost
levelCostRatio: 1.15       # levelBaseCost = ratio x openCost (floors 3 and up)
growthStep: 0.01           # growth drops by this per floor above floor 2
cycleDoubling: 2           # each floor's cycle is this many times the one below (from floor 2)
hireRatio: [200, 125, 70, 40, 25, 17, 14, 12, 12]   # floors 2 to 10, times openCost
floors:
  world.w1:
    - { id: floor.w1.windowsill,    favouredFamily: mint }
    - { id: floor.w1.balcony,       favouredFamily: basil }
    - { id: floor.w1.hemp_patch,    favouredFamily: hemp }
