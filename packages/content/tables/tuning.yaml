# --- Timed boosts (GDD 13.5) ---
# Every timed boost in a world adds into one Boost with a cap; a Growth Spurt
# is the only timed multiplier on top; lump sums pay from the steady rate.
# The rule is data so the version 0.1 rule can be replayed for comparison
# (apps/sim/proposals/gdd-v0.1-boosts.yaml): BOOST_STACKING add | multiply | strongest,
# BOOST_CAP 0 = no cap, LUMP_SUM_USES_BOOSTS true = lump sums read the boosted rate.
BOOST_STACKING: add
BOOST_CAP: 15
LUMP_SUM_USES_BOOSTS: false

