# Chests. Source of truth: GDD 8.3. Odds are weights in percent for one card slot.
# guarantee: slots rolled first among that rarity and better, in the table's proportions.
# A chest's tier is its rarity on the ladder (tiers.yaml). Card slots never roll above CHEST_CARD_TOP (tuning.yaml).
# Tiers 7 to 11 are design 0.5 (EXPANSION 4.3): card slots roll like the Starlight Chest, and every extra is fixed,
# never rolled. heirloomSlots: one sure heirloom each, at least that tier (any: the normal odds). headCopies: Head
# copies (rule 9). extras: materials and cosmetics for later systems, kept in the item bag until they arrive.
