# The rarity ladder: eleven tiers, lowest first (design 0.5: EXPANSION 2.1, 2.2, 4.1 and 4.2;
# style bible v1.7, sections 8 and 19). Every card, chest, item and moment names its tier by id.
# No code compares tier names: a rule that singles out a tier names it in data (tuning.yaml).
# Display names are in text/en.yaml under `rarities`.
#
# order    1 to 11. A tier's power is TIER_STEP ^ (order - 1) (tuning.yaml).
# look     palette tokens (dark to light steps, docs/art/palette): main, light and dark colours,
#          and the colours the screen floods with at a full reveal's burst.
# emblem   the badge in art/icons/rarity/, or null until it is drawn.
# burst    the burst animation in art/effects/reveal/bursts.json, or null for the nearest lower one.
# chest    the chest art material for a chest of this tier (art/chests/), or null for the nearest lower one.
# pips     pips on small cards.
# chime    the climb's chime, in steps up a pentatonic scale: one note higher per tier.
# sting    notes in the closing sting.
# reveal   the full form (bible 19). total: seconds from the first jolt to the end of the Show
#          (EXPANSION 4.1 rule 4); hold: seconds the best card is held up; hops, lift, dim: the Build;
#          blackout: seconds of darkness before the burst; shake: pixels; rays, ring, beam: burst parts.
#          short: total seconds of the short form (climb, burst, chime).
# juice    how hard a moment of this tier hits (EXPANSION 4.2): particles, shake in pixels, flash
#          strength 0 to 1, hit-pause seconds, sound layers. A short moment flashes at half strength
#          and pauses for half as long. The Uncommon row is the Bumper tap's punch.
# The timings are a first pass for the playtest to tune.
