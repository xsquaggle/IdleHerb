id: p5-late-research
title: Late research tiers and one Mastery list per world (Game Designer's p5)
why: |-
  The Game Designer's eight late research rows (proposal p5, 2026-11-26), run on top of p1-levels, p2-taps and p4-gates.
  Costs: the designer's first-pass costs times 0.06 (Crop Rotation IV 12,000 up to Living Soil VI 36,000). The Insight rate is about 11,000 to 13,000 a day for the active player from day 20 to day 65, and the 40 existing projects (626,000 Insight in all) use nearly all of it up to day 64.
  Living Soil I hangs on Soil Science III instead of Soil Science V: Soil Science V costs 150,000 and lands on day 64 for the active player, so with it as the requirement no factor can start the chain before then.
  Living Soil profit x1.6 each instead of x2: at x2 the active player had Festival gaps of 3.0 to 3.7 days after day 30 and at x1.7 gaps of 3.6 and 3.9, below the designer's floor of 4. The designer's rule was to lower the multiplier before touching the costs.
  Crop Rotation IV is floor speed x1.4, like Crop Rotation I to III.
  Mastery: each world gets its own ten levels (multiples of 25), picked from the crossing data of 90-day active runs and refit three times on runs with the lists in place so the active player's stars land near the designer's days after arrival (under 1, 1-2, 3-4, 5-6, 8-10, 12-14, 18-22, 28-34, 40-46, 55-65), with one star on arrival day and star 5 not before day 8. Thymeford's stars 7 to 10 (625, 700, 775, 850) are not measured: its lowest floor stops at about level 565 in week 2 (see the report).
