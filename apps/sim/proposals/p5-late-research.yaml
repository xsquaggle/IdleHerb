id: p5-late-research
title: Late research tiers and one Mastery list per world (Game Designer's p5)
why: |-
  The Game Designer's eight late research rows (proposal p5, 2026-11-26), run on top of p1-levels, p2-taps and p4-gates.
  Costs: the designer's first-pass costs times 0.06 (Crop Rotation IV 12,000 up to Living Soil VI 36,000). The Insight rate is about 11,000 to 13,000 a day for the active player from day 20 to day 65, and the 40 existing projects (626,000 Insight in all) use nearly all of it up to day 64.
  Living Soil I hangs on Soil Science III instead of Soil Science V: Soil Science V costs 150,000 and lands on day 64 for the active player, so with it as the requirement no factor can start the chain before then.
  Living Soil profit x1.3 each instead of x2: at x2 the active player had Festival gaps of 3.0 to 3.7 days after day 30 and at x1.7 gaps of 3.6 and 3.9, below the designer's floor of 4, so the first run used x1.6. With the Auto-Gardener rule older worlds earn again and x1.6 gave gaps of 3.2 to 4.0 days after day 30; x1.3 gives 4.4 to 8.8 for active and mixed. The designer's rule was to lower the multiplier before touching the costs.
  Crop Rotation IV is floor speed x1.4, like Crop Rotation I to III.
  Auto-Gardener (Game Designer's ruling, 2026-11-26, last change before design 0.4): AUTO_GARDENER_RESTARTS turns on two more jobs while the Auto-Gardener is owned and switched on and the game is open. A world opens its next floor when that costs at most AUTO_BUY_SHARE of the coins in hand, and floor 1's manager in every unlocked world stays hired through every Replant and Festival with no fee. No world goes dead after a Replant any more.
  Mastery: each world gets its own ten levels (multiples of 25), picked from the mean crossing days of four 90-day active runs with the Auto-Gardener rule in place (each run with the previous pick in place), so the active player's stars land near the designer's days after arrival (under 1, 1-2, 3-4, 5-6, 8-10, 12-14, 18-22, 28-34, 40-46, 55-65), with one star on arrival day and star 5 not before day 8 (picked at day 9 or later on the mean, because star days move by about a day between runs: a world's best level rises once per Festival cycle). World 5's star 5 is level 300 on about day 13, because 275 lands on day 7.4 to 9.1. Every star of every world is measured now, Thymeford's 7 to 10 included.
tuning:
  AUTO_GARDENER_RESTARTS: true
