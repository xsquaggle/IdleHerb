id: p4-gates
title: Gate prices fitted to the pacing targets (active profile)
why: |-
  Fitted by "pnpm sim calibrate" on top of p1-levels, p2-taps.
  First Replant: 60 -> 440, set by rule rather than fitted: every play style's first Replant must land inside its first 24 hours, and 448 is the largest minimum that keeps the idle player's inside day 1 (16.2 h; the active player's lands at 38 min, the mixed player's at 6.5 h).
  World 6 deed: 600 -> 250 Ribbons, so the deed does not hold World 6 back once Ribbons come more slowly.
  World 2: 5e19 -> 3.0e+23 (target 12.0 h, lands 11.7 h)
  World 3: 2e19 -> 4.5e+23 (target day 2.60, lands day 2.60)
  First Harvest Festival: 50000 -> 6.5e+5, set by hand after the fit (8.6e+5 put the active player's first Festival on day 4.35) to smooth the Festival rhythm: first Festival on day 3.5 active, 5.6 mixed, 14.2 idle, and 18 gaps that break the designer's rhythm across the three play styles instead of 24. Eight Golden Hour price lists were tried as well; none beat the GDD's own. Raised to 9.0e+5 for the Auto-Gardener rule (see below).
  World 4: 1e24 -> 1.0e+26 (target day 6.70, lands day 6.70), lowered by hand to 1e+25 once the Auto-Gardener kept every world going (see below).
  World 5: 2e29 -> 7.3e+31 (target day 12.20, lands day 12.47), lowered by hand to 3e+30 (see below).
  World 6: 1e34 -> 3e+35, set by hand: the fitted 1.4e+34 put the mixed player in World 6 on day 19.4 once the late research (p5-late-research) was in, and with the Auto-Gardener rule 6e+34 put it there on day 17.4, both before its window.
  Refit for the Auto-Gardener rule (Game Designer, 2026-11-26): with older worlds earning again, Festivals came faster (12 and 13 by day 30 for active and mixed) and the idle player reached World 5 after day 26. RIBBON_C0 650,000 -> 900,000 (the first Festival needs more Compost, so fewer Festivals by day 30) and the World 4 and World 5 tickets above (so the idle player still reaches them by days 20 and 26). Sixteen combinations of RIBBON_C0 (650,000 to 2.6 million), the World 4 to 6 tickets and Living Soil were run; this one keeps every gate in its window.
tuning:
  FIRST_REPLANT_MIN: 440
  RIBBON_C0: 900000
